<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-6">
    <a routerLink="/pipeline" class="inline-flex items-center gap-1.5 text-sm text-neutral-500 dark:text-neutral-400 hover:text-primary-500 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
      </svg>
      Volver al Pipeline
    </a>
  </div>

  @if (loading()) {
    <div class="space-y-6">
      <app-skeleton-loader type="card" [count]="1" />
      <app-skeleton-loader type="card" [count]="1" />
      <app-skeleton-loader type="timeline" [count]="4" />
    </div>
  } @else if (error(); as err) {
    <div class="bg-warning-50 dark:bg-warning-500/10 border border-warning-500 rounded-xl p-6 text-center">
      <p class="text-warning-700 dark:text-warning-500 font-medium">{{ err }}</p>
      <button (click)="loadDeal()" class="mt-3 px-4 py-2 bg-primary-500 text-white rounded-lg text-sm hover:bg-primary-700 transition-colors">Reintentar</button>
    </div>
  } @else if (deal(); as d) {
    <div class="space-y-6">
      <app-deal-info [deal]="d" (edit)="showEditForm.set(true)" />
      <app-deal-stage-selector [deal]="d" (stageChange)="onStageChange($event)" />
      <app-activity-timeline [activities]="activities()" (newActivity)="showActivityForm.set(true)" />
    </div>
  }

  @if (showEditForm()) {
    <app-deal-form-modal [deal]="deal()" [loading]="formLoading()" (save)="onEditDeal($event)" (close)="showEditForm.set(false)" />
  }

  @if (showActivityForm()) {
    <app-activity-form-modal [loading]="formLoading()" (save)="onNewActivity($event)" (close)="showActivityForm.set(false)" />
  }
</div>
