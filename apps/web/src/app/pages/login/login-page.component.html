<div class="min-h-screen flex items-center justify-center bg-neutral-50 dark:bg-[#1a1a1a] px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-primary-500 rounded-xl flex items-center justify-center mx-auto mb-4">
        <span class="text-white font-bold text-xl">C</span>
      </div>
      <h1 class="text-2xl font-bold text-neutral-900 dark:text-white">CRM Multi-Tenant</h1>
      <p class="text-sm text-neutral-500 dark:text-neutral-400 mt-1">Gestiona tus contactos y pipeline de ventas</p>
    </div>

    <div class="bg-white dark:bg-[#2a2a2a] rounded-xl shadow-lg border border-neutral-200 dark:border-neutral-700 p-6">
      @if (isLoginMode()) {
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
          <h2 class="text-lg font-semibold text-neutral-900 dark:text-white">Iniciar Sesión</h2>
          <div>
            <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Email</label>
            <input type="email" formControlName="email" class="w-full px-3 py-2 rounded-lg border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-[#1a1a1a] text-neutral-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm" placeholder="tu@email.com">
          </div>
          <div>
            <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Contraseña</label>
            <input type="password" formControlName="password" class="w-full px-3 py-2 rounded-lg border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-[#1a1a1a] text-neutral-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm" placeholder="••••••">
          </div>
          @if (error(); as err) {
            <div class="text-sm text-warning-500 bg-warning-50 dark:bg-warning-500/10 rounded-lg p-3">{{ err }}</div>
          }
          <button type="submit" [disabled]="loading()" class="w-full py-2.5 px-4 bg-primary-500 hover:bg-primary-700 text-white font-medium rounded-lg transition-colors disabled:opacity-50 flex items-center justify-center gap-2 text-sm">
            @if (loading()) {
              <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            }
            Iniciar Sesión
          </button>
          <p class="text-center text-sm text-neutral-500 dark:text-neutral-400">
            ¿No tienes cuenta?
            <button type="button" (click)="toggleMode()" class="text-primary-500 hover:text-primary-700 font-medium">Crear Organización</button>
          </p>
        </form>
      } @else {
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
          <h2 class="text-lg font-semibold text-neutral-900 dark:text-white">Crear Organización</h2>
          <div>
            <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Nombre de la Organización</label>
            <input type="text" formControlName="orgName" class="w-full px-3 py-2 rounded-lg border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-[#1a1a1a] text-neutral-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm" placeholder="Mi Empresa">
          </div>
          <div>
            <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Tu Nombre</label>
            <input type="text" formControlName="userName" class="w-full px-3 py-2 rounded-lg border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-[#1a1a1a] text-neutral-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm" placeholder="Juan Pérez">
          </div>
          <div>
            <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Email</label>
            <input type="email" formControlName="email" class="w-full px-3 py-2 rounded-lg border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-[#1a1a1a] text-neutral-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm" placeholder="tu@email.com">
          </div>
          <div>
            <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Contraseña</label>
            <input type="password" formControlName="password" class="w-full px-3 py-2 rounded-lg border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-[#1a1a1a] text-neutral-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-sm" placeholder="••••••">
          </div>
          @if (error(); as err) {
            <div class="text-sm text-warning-500 bg-warning-50 dark:bg-warning-500/10 rounded-lg p-3">{{ err }}</div>
          }
          <button type="submit" [disabled]="loading()" class="w-full py-2.5 px-4 bg-primary-500 hover:bg-primary-700 text-white font-medium rounded-lg transition-colors disabled:opacity-50 flex items-center justify-center gap-2 text-sm">
            @if (loading()) {
              <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            }
            Crear Organización
          </button>
          <p class="text-center text-sm text-neutral-500 dark:text-neutral-400">
            ¿Ya tienes cuenta?
            <button type="button" (click)="toggleMode()" class="text-primary-500 hover:text-primary-700 font-medium">Iniciar Sesión</button>
          </p>
        </form>
      }
    </div>
  </div>
</div>
