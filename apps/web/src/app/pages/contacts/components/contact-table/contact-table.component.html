<div class="overflow-x-auto">
  <table class="w-full">
    <thead>
      <tr class="border-b border-neutral-200 dark:border-neutral-700">
        <th class="text-left py-3 px-4 text-xs font-medium text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Nombre</th>
        <th class="text-left py-3 px-4 text-xs font-medium text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Email</th>
        <th class="text-left py-3 px-4 text-xs font-medium text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Empresa</th>
        <th class="text-left py-3 px-4 text-xs font-medium text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Teléfono</th>
        <th class="text-right py-3 px-4 text-xs font-medium text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Acciones</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-neutral-100 dark:divide-neutral-800">
      @for (contact of contacts(); track contact.id; let i = $index) {
        <tr class="hover:bg-neutral-50 dark:hover:bg-neutral-800/50 transition-colors" [class.bg-neutral-50/50]="i % 2 === 1" [class.dark:bg-neutral-800/30]="i % 2 === 1">
          <td class="py-3 px-4">
            <a [routerLink]="['/contacts', contact.id]" class="text-sm font-medium text-primary-500 hover:text-primary-700 transition-colors">
              {{ contact.name }}
            </a>
          </td>
          <td class="py-3 px-4 text-sm text-neutral-600 dark:text-neutral-400">{{ contact.email }}</td>
          <td class="py-3 px-4 text-sm text-neutral-600 dark:text-neutral-400">{{ contact.company || '-' }}</td>
          <td class="py-3 px-4 text-sm text-neutral-600 dark:text-neutral-400">{{ contact.phone || '-' }}</td>
          <td class="py-3 px-4 text-right">
            <div class="flex items-center justify-end gap-2">
              <button (click)="edit.emit(contact)" class="p-1.5 rounded-lg text-neutral-400 hover:text-primary-500 hover:bg-primary-50 dark:hover:bg-primary-900/30 transition-colors" title="Editar">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
                </svg>
              </button>
              <button (click)="delete.emit(contact)" class="p-1.5 rounded-lg text-neutral-400 hover:text-warning-500 hover:bg-warning-50 dark:hover:bg-warning-500/10 transition-colors" title="Eliminar">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
