<div class="flex items-center justify-between px-4 py-3 border-t border-neutral-200 dark:border-neutral-700">
  <p class="text-sm text-neutral-500 dark:text-neutral-400">
    Total: <span class="font-medium text-neutral-700 dark:text-neutral-300">{{ total() }}</span> contactos
  </p>
  <div class="flex items-center gap-1">
    <button
      (click)="pageChange.emit(page() - 1)"
      [disabled]="page() <= 1"
      class="p-2 rounded-lg text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
      </svg>
    </button>

    @for (p of [].constructor(totalPages()); track $index) {
      @let pageNum = $index + 1;
      <button
        (click)="pageChange.emit(pageNum)"
        class="w-8 h-8 rounded-lg text-sm font-medium transition-colors"
        [class.bg-primary-500]="pageNum === page()"
        [class.text-white]="pageNum === page()"
        [class.text-neutral-600]="pageNum !== page()"
        [class.dark:text-neutral-400]="pageNum !== page()"
        [class.hover:bg-neutral-100]="pageNum !== page()"
        [class.dark:hover:bg-neutral-800]="pageNum !== page()"
      >
        {{ pageNum }}
      </button>
    }

    <button
      (click)="pageChange.emit(page() + 1)"
      [disabled]="page() >= totalPages()"
      class="p-2 rounded-lg text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>
</div>
