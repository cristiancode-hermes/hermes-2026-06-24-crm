<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-2xl font-bold text-neutral-900 dark:text-white">Contactos</h1>
  </div>

  <div class="space-y-4">
    <app-contact-search (searchChange)="onSearch($event)" (createNew)="openCreateForm()" />

    @if (loading()) {
      <app-skeleton-loader type="table" [count]="5" />
    } @else if (error(); as err) {
      <div class="bg-warning-50 dark:bg-warning-500/10 border border-warning-500 rounded-xl p-6 text-center">
        <p class="text-warning-700 dark:text-warning-500 font-medium">{{ err }}</p>
        <button (click)="loadContacts()" class="mt-3 px-4 py-2 bg-primary-500 text-white rounded-lg text-sm hover:bg-primary-700 transition-colors">Reintentar</button>
      </div>
    } @else if (contacts().length === 0) {
      <div class="bg-white dark:bg-[#2a2a2a] rounded-xl border border-neutral-200 dark:border-neutral-700 p-12 text-center">
        <div class="w-16 h-16 bg-neutral-100 dark:bg-neutral-800 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-neutral-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
          </svg>
        </div>
        <h3 class="text-lg font-semibold text-neutral-900 dark:text-white mb-2">No hay contactos</h3>
        <p class="text-sm text-neutral-500 dark:text-neutral-400 mb-6">Comienza agregando tu primer contacto</p>
        <button (click)="openCreateForm()" class="px-4 py-2 bg-primary-500 hover:bg-primary-700 text-white font-medium rounded-lg transition-colors text-sm">Crear Contacto</button>
      </div>
    } @else {
      <div class="bg-white dark:bg-[#2a2a2a] rounded-xl border border-neutral-200 dark:border-neutral-700 overflow-hidden">
        <app-contact-table [contacts]="contacts()" (edit)="openEditForm($event)" (delete)="confirmDelete($event)" />
        <app-pagination [page]="page()" [totalPages]="totalPages()" [total]="total()" (pageChange)="onPageChange($event)" />
      </div>
    }
  </div>

  @if (showForm()) {
    <app-contact-form-modal [contact]="editingContact()" [loading]="formLoading()" (save)="onSave($event)" (close)="closeForm()" />
  }

  @if (showDeleteConfirm()) {
    <app-confirm-modal
      title="Eliminar Contacto"
      message="¿Estás seguro de eliminar a {{ deletingContact()?.name }}? Esta acción no se puede deshacer."
      confirmText="Eliminar"
      cancelText="Cancelar"
      [loading]="formLoading()"
      (confirm)="onDelete()"
      (cancel)="showDeleteConfirm.set(false)"
    />
  }
</div>
