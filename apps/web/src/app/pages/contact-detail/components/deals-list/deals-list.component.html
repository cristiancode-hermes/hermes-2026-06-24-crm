<div class="bg-white dark:bg-[#2a2a2a] rounded-xl border border-neutral-200 dark:border-neutral-700 p-6">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-lg font-semibold text-neutral-900 dark:text-white">Deals</h3>
    <button (click)="newDeal.emit()" class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-white bg-primary-500 hover:bg-primary-700 rounded-lg transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
      </svg>
      Nuevo Deal
    </button>
  </div>
  @if (deals().length) {
    <div class="space-y-2">
      @for (deal of deals(); track deal.id) {
        <a [routerLink]="['/pipeline/deal', deal.id]" class="flex items-center justify-between p-3 rounded-lg hover:bg-neutral-50 dark:hover:bg-neutral-800 transition-colors group">
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-neutral-900 dark:text-white group-hover:text-primary-500 transition-colors">{{ deal.name }}</p>
            <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-0.5">{{ deal.stage }}</p>
          </div>
          <p class="text-sm font-semibold text-neutral-900 dark:text-white">{{ deal.value | currency:'MXN':'symbol-narrow':'1.0-0' }}</p>
        </a>
      }
    </div>
  } @else {
    <p class="text-sm text-neutral-500 dark:text-neutral-400 text-center py-6">No hay deals asociados a este contacto</p>
  }
</div>
