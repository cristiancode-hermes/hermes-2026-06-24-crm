<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-2xl font-bold text-neutral-900 dark:text-white">Dashboard</h1>
  </div>

  @if (loading()) {
    <div class="space-y-6">
      <app-skeleton-loader type="card" [count]="4" />
      <app-skeleton-loader type="chart" />
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <app-skeleton-loader type="card" [count]="1" />
        <app-skeleton-loader type="timeline" [count]="3" />
      </div>
    </div>
  } @else if (error(); as err) {
    <div class="bg-warning-50 dark:bg-warning-500/10 border border-warning-500 rounded-xl p-6 text-center">
      <p class="text-warning-700 dark:text-warning-500 font-medium">{{ err }}</p>
      <button (click)="loadDashboard()" class="mt-3 px-4 py-2 bg-primary-500 text-white rounded-lg text-sm hover:bg-primary-700 transition-colors">
        Reintentar
      </button>
    </div>
  } @else if (data(); as d) {
    <div class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <app-kpi-card title="Total Deals" [value]="d.kpis.totalDeals" subtitle="En pipeline" icon="deals" color="primary" />
        <app-kpi-card title="Valor Pipeline" [value]="formatCurrency(d.kpis.pipelineValue)" subtitle="Valor total" icon="pipeline" color="secondary" />
        <app-kpi-card title="Ganados" [value]="formatCurrency(d.kpis.wonValue)" subtitle="Valor cerrado" icon="won" color="success" />
        <app-kpi-card title="Tasa Conversión" [value]="d.kpis.conversionRate + '%'" subtitle="Tasa general" icon="conversion" color="accent" />
      </div>

      <app-pipeline-chart [data]="d.chartData" />

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <app-upcoming-deals [deals]="d.upcomingDeals" />
        <app-recent-activity [activities]="d.recentActivities" />
      </div>
    </div>
  } @else {
    <div class="text-center py-16">
      <div class="w-16 h-16 bg-neutral-100 dark:bg-neutral-800 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-neutral-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd"/>
        </svg>
      </div>
      <h2 class="text-xl font-semibold text-neutral-900 dark:text-white mb-2">Bienvenido a CRM</h2>
      <p class="text-neutral-500 dark:text-neutral-400 mb-6">Comienza creando tu primer contacto y deal</p>
      <div class="flex justify-center gap-3">
        <a routerLink="/contacts" class="px-4 py-2 bg-primary-500 text-white rounded-lg text-sm font-medium hover:bg-primary-700 transition-colors">Ir a Contactos</a>
        <a routerLink="/pipeline" class="px-4 py-2 bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 rounded-lg text-sm font-medium hover:bg-neutral-200 dark:hover:bg-neutral-700 transition-colors">Ir al Pipeline</a>
      </div>
    </div>
  }
</div>
