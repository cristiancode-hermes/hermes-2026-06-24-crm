<div class="flex items-center justify-between mb-6">
  <div class="flex items-center gap-3">
    <h1 class="text-2xl font-bold text-neutral-900 dark:text-white">Pipeline</h1>
    <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary-50 dark:bg-primary-900/30 text-primary-700 dark:text-primary-300">
      {{ totalDeals() }} deals
    </span>
  </div>
  <div class="flex items-center gap-2">
    <button (click)="exportDeals.emit()" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-neutral-300 dark:border-neutral-600 text-sm font-medium text-neutral-700 dark:text-neutral-200 hover:border-primary-400 hover:text-primary-700 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
        <path fill-rule="evenodd" d="M3 3.5A1.5 1.5 0 014.5 2h6.879a1.5 1.5 0 011.06.44l4.122 4.12A1.5 1.5 0 0117 7.622V16.5a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 013 16.5v-13zm10.857 5.691a.75.75 0 00-1.06-1.06L10 10.56 7.203 8.13a.75.75 0 00-1.06 1.06l3 3.25a.75.75 0 001.06 0l3.654-3.75z" clip-rule="evenodd"/>
      </svg>
      Export CSV
    </button>
    <button (click)="newDeal.emit()" class="flex items-center gap-2 px-4 py-2 bg-primary-500 hover:bg-primary-700 text-white font-medium rounded-lg transition-colors text-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
      </svg>
      Nuevo Deal
    </button>
  </div>
</div>
