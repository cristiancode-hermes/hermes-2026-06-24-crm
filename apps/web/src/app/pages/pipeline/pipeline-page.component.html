<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  @if (loading()) {
    <div class="space-y-6">
      <app-skeleton-loader type="card" [count]="1" />
      <app-skeleton-loader type="chart" />
    </div>
  } @else if (error(); as err) {
    <div class="bg-warning-50 dark:bg-warning-500/10 border border-warning-500 rounded-xl p-6 text-center">
      <p class="text-warning-700 dark:text-warning-500 font-medium">{{ err }}</p>
      <button (click)="loadDeals()" class="mt-3 px-4 py-2 bg-primary-500 text-white rounded-lg text-sm hover:bg-primary-700 transition-colors">Reintentar</button>
    </div>
  } @else {
    <app-pipeline-controls [totalDeals]="deals().length" (newDeal)="openCreateForm()" />

    @if (deals().length === 0) {
      <div class="bg-white dark:bg-[#2a2a2a] rounded-xl border border-neutral-200 dark:border-neutral-700 p-12 text-center">
        <div class="w-16 h-16 bg-neutral-100 dark:bg-neutral-800 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-neutral-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11 4a1 1 0 10-2 0v4a1 1 0 102 0V7zm-3 1a1 1 0 10-2 0v3a1 1 0 102 0V8zM8 9a1 1 0 00-2 0v2a1 1 0 102 0V9z" clip-rule="evenodd"/>
          </svg>
        </div>
        <h3 class="text-lg font-semibold text-neutral-900 dark:text-white mb-2">No hay deals</h3>
        <p class="text-sm text-neutral-500 dark:text-neutral-400 mb-6">Crea tu primer deal para comenzar</p>
        <button (click)="openCreateForm()" class="px-4 py-2 bg-primary-500 hover:bg-primary-700 text-white font-medium rounded-lg transition-colors text-sm">Crear Deal</button>
      </div>
    } @else {
      <app-kanban-board [deals]="deals()" (stageChanged)="onStageChange($event)" />
      <div class="mt-4">
        <app-pipeline-value-bar [stageValues]="stageValues()" />
      </div>
    }
  }

  @if (showForm()) {
    <app-deal-form-modal
      [loading]="formLoading()"
      [contactId]="contactIdFromRoute()"
      (save)="onSave($event)"
      (close)="closeForm()"
    />
  }
</div>
