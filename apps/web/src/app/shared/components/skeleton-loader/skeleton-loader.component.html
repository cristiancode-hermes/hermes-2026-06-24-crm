@switch (type()) {
  @case ('card') {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      @for (i of [].constructor(count()); track i) {
        <div class="bg-white dark:bg-[#2a2a2a] rounded-xl p-6 border border-neutral-200 dark:border-neutral-700">
          <div class="skeleton h-4 w-20 mb-3 rounded"></div>
          <div class="skeleton h-8 w-32 mb-2 rounded"></div>
          <div class="skeleton h-3 w-24 rounded"></div>
        </div>
      }
    </div>
  }
  @case ('table') {
    <div class="bg-white dark:bg-[#2a2a2a] rounded-xl border border-neutral-200 dark:border-neutral-700 overflow-hidden">
      <div class="p-4 border-b border-neutral-200 dark:border-neutral-700">
        <div class="skeleton h-10 w-full rounded-lg"></div>
      </div>
      @for (i of [].constructor(count()); track i) {
        <div class="p-4 border-b border-neutral-100 dark:border-neutral-800">
          <div class="flex gap-4">
            <div class="skeleton h-5 flex-1 rounded"></div>
            <div class="skeleton h-5 w-48 rounded"></div>
            <div class="skeleton h-5 w-32 rounded"></div>
            <div class="skeleton h-5 w-28 rounded"></div>
          </div>
        </div>
      }
    </div>
  }
  @case ('chart') {
    <div class="bg-white dark:bg-[#2a2a2a] rounded-xl p-6 border border-neutral-200 dark:border-neutral-700">
      <div class="skeleton h-5 w-40 mb-6 rounded"></div>
      <div class="flex items-end gap-3 h-48">
        @for (i of [1,2,3,4,5,6]; track i) {
          <div class="skeleton flex-1 rounded-t-lg" [style.height]="(30 + i * 10) + '%'"></div>
        }
      </div>
    </div>
  }
  @case ('timeline') {
    <div class="space-y-4">
      @for (i of [].constructor(count()); track i) {
        <div class="flex gap-3">
          <div class="skeleton w-3 h-3 rounded-full mt-1.5 flex-shrink-0"></div>
          <div class="flex-1 min-w-0">
            <div class="skeleton h-4 w-48 mb-2 rounded"></div>
            <div class="skeleton h-3 w-full rounded"></div>
          </div>
        </div>
      }
    </div>
  }
}
